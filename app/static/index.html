<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>增量构建裁决台</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2638; --line: #2a3550;
    --fg: #dbe4f5; --dim: #8b98b8;
    --reusable: #34c98e; --waiting: #e8b93e; --executable: #4f9cf7; --done: #9a7ff0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px;
          border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
  .chip b { font-size: 15px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  #toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px;
             border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--executable); }
  button.on { background: var(--executable); color: #fff; }
  #status { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 1.1fr 1fr 1.2fr; gap: 12px; padding: 12px 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 12px; min-height: 70vh; overflow: auto; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--dim); font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button.active { background: var(--executable); color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { padding: 6px 8px; border-radius: 6px; cursor: pointer;
            font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.item:hover { background: var(--panel2); }
  li.item.sel { background: var(--panel2); outline: 1px solid var(--executable); }
  .badge { display: inline-block; min-width: 52px; text-align: center; font-size: 11px;
           border-radius: 4px; padding: 1px 6px; margin-right: 8px; color: #0f1420; }
  .b-reusable { background: var(--reusable); } .b-waiting { background: var(--waiting); }
  .b-executable { background: var(--executable); } .b-done { background: var(--done); }
  .chg { padding: 5px 8px; border-bottom: 1px solid var(--line); font-size: 12.5px;
         font-family: ui-monospace, Consolas, monospace; }
  .chg .why { color: var(--dim); font-family: inherit; display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.k { color: var(--dim); white-space: nowrap; width: 110px; }
  code { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .chain { margin: 6px 0; padding-left: 4px; }
  .chain li { margin: 0 0 6px; padding: 6px 10px; background: var(--panel2);
              border-left: 3px solid var(--waiting); border-radius: 4px; list-style: none; }
  .chain li:last-child { border-left-color: var(--executable); }
  .muted { color: var(--dim); }
  #version { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>增量构建裁决台</h1>
  <span class="chip"><span class="dot" style="background:var(--reusable)"></span>可复用 <b id="c-reusable">0</b></span>
  <span class="chip"><span class="dot" style="background:var(--waiting)"></span>待上游 <b id="c-waiting">0</b></span>
  <span class="chip"><span class="dot" style="background:var(--executable)"></span>可执行 <b id="c-executable">0</b></span>
  <span class="chip"><span class="dot" style="background:var(--done)"></span>已完成 <b id="c-done">0</b></span>
  <span class="chip">计划版本 <b id="version">0</b></span>
</header>
<div id="toolbar">
  <button id="btn-seed">导入演示图</button>
  <button id="btn-step">执行一步</button>
  <button id="btn-auto">自动执行：关</button>
  <span id="status">就绪</span>
</div>
<main>
  <section>
    <h2>任务列表</h2>
    <div class="tabs" id="tabs">
      <button data-state="executable" class="active">可执行</button>
      <button data-state="waiting">待上游</button>
      <button data-state="reusable">可复用</button>
      <button data-state="done">已完成</button>
    </div>
    <ul id="task-list"></ul>
  </section>
  <section>
    <h2>变更流（按版本增量到达）</h2>
    <ul id="changes"></ul>
  </section>
  <section>
    <h2>任务详情与最短失效原因链</h2>
    <div id="detail" class="muted">点击左侧任务查看详情</div>
  </section>
</main>
<script>
"use strict";
const STATE_NAMES = { reusable: "可复用", waiting: "待上游", executable: "可执行", done: "已完成" };
let version = 0;            // 已消费的计划版本
let currentTab = "executable";
let selected = null;
let autoTimer = null;
let listDirty = true;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function jpost(url, body) {
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function setStatus(msg) { $("status").textContent = msg; }

function renderCounts(s) {
  for (const k of ["reusable", "waiting", "executable", "done"])
    $("c-" + k).textContent = s.counts[k] ?? 0;
}

function badge(state) {
  return `<span class="badge b-${state}">${STATE_NAMES[state] || state}</span>`;
}

function prependChanges(changes) {
  const ul = $("changes");
  for (let i = changes.length - 1; i >= 0; i--) {
    const c = changes[i];
    const li = document.createElement("li");
    li.className = "chg";
    const why = c.reason && c.reason.length ? c.reason[c.reason.length - 1].why : "";
    li.innerHTML = `${badge(c.state)}<code>${esc(c.id)}</code>` +
      (why ? `<span class="why">${esc(why)}</span>` : "");
    li.onclick = () => showDetail(c.id);
    ul.prepend(li);
  }
  while (ul.children.length > 400) ul.removeChild(ul.lastChild);
}

async function loadList() {
  const d = await jget(`/api/tasks?state=${currentTab}&limit=150`);
  const ul = $("task-list");
  ul.innerHTML = "";
  for (const id of d.tasks) {
    const li = document.createElement("li");
    li.className = "item" + (id === selected ? " sel" : "");
    li.textContent = id;
    li.onclick = () => showDetail(id);
    ul.appendChild(li);
  }
  if (!d.tasks.length) ul.innerHTML = `<li class="item muted">（空）</li>`;
  listDirty = false;
}

async function showDetail(id) {
  selected = id;
  const el = $("detail");
  try {
    const d = await jget("/api/tasks/" + encodeURIComponent(id));
    const row = (k, v) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`;
    const digest = (label, cur, prev) => row(label,
      `<code>${esc(cur ?? "—")}</code>` +
      (prev !== undefined && prev !== cur ? `<br><span class="muted">上次 <code>${esc(prev ?? "—")}</code></span>` : ""));
    let html = `<table>`;
    html += row("状态", badge(d.state));
    html += digest("定义摘要", d.def_digest, d.prev_def_digest);
    html += digest("源文件摘要", d.src_digest, d.prev_src_digest);
    html += row("当前产物", `<code>${esc(d.artifact_digest ?? "（未落定）")}</code>`);
    html += row("上次产物", `<code>${esc(d.prev_artifact_digest ?? "—")}</code>`);
    html += row("静态前置", d.static_deps.length
      ? d.static_deps.map((x) => `<code>${esc(x)}</code>`).join("<br>") : "—");
    html += row("动态前置", d.dyn_deps.length
      ? d.dyn_deps.map((x) => `<code>${esc(x)}</code>`).join("<br>") : "—");
    const reads = Object.entries(d.prev_reads || {});
    html += row("历史读取", reads.length
      ? reads.map(([k, v]) => `<code>${esc(k)}</code> = <code>${esc(v)}</code>`).join("<br>") : "—");
    if (d.fingerprint) html += row("输入指纹", `<code>${esc(d.fingerprint)}</code>`);
    html += `</table>`;
    if (d.reason && d.reason.length) {
      html += `<h2 style="margin-top:12px">最短失效原因链（${d.reason.length} 跳）</h2><ul class="chain">`;
      d.reason.forEach((link, i) => {
        html += `<li><b>${i + 1}.</b> <code>${esc(link.task)}</code><br>${esc(link.why)}</li>`;
      });
      html += `</ul>`;
    } else {
      html += `<p class="muted">无失效原因：该任务可复用或已完成。</p>`;
    }
    el.innerHTML = html;
    document.querySelectorAll("#task-list .item").forEach((li) =>
      li.classList.toggle("sel", li.textContent === id));
  } catch (e) {
    el.textContent = "加载失败：" + e.message;
  }
}

async function poll() {
  try {
    const s = await jget("/api/summary");
    renderCounts(s);
    const p = await jget("/api/plan?since=" + version);
    version = p.version;
    $("version").textContent = version;
    if (p.changes.length) {
      prependChanges(p.changes);
      listDirty = true;
      if (selected) {
        const hit = p.changes.some((c) => c.id === selected);
        if (hit) showDetail(selected);
      }
    }
    if (listDirty) await loadList();
    setStatus("轮询正常 · " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("连接失败：" + e.message);
  }
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  currentTab = b.dataset.state;
  document.querySelectorAll("#tabs button").forEach((x) =>
    x.classList.toggle("active", x === b));
  loadList();
});

$("btn-seed").onclick = async () => {
  setStatus("正在导入演示图…");
  const r = await jpost("/api/demo/seed");
  setStatus(`已导入 ${r.tasks} 个任务、${r.deps} 条依赖`);
  await poll();
};

$("btn-step").onclick = async () => {
  const r = await jpost("/api/demo/step");
  setStatus(r.ran ? `已执行 ${r.ran}` : "没有可执行任务");
  await poll();
};

$("btn-auto").onclick = () => {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    $("btn-auto").textContent = "自动执行：关";
    $("btn-auto").classList.remove("on");
  } else {
    autoTimer = setInterval(async () => {
      const r = await jpost("/api/demo/step");
      if (!r.ran) $("btn-auto").click();
    }, 400);
    $("btn-auto").textContent = "自动执行：开";
    $("btn-auto").classList.add("on");
  }
};

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
